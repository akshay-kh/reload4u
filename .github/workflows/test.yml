name: Tests

# Runs on every PR (each new commit pushed to a PR branch) and on pushes to
# master (a merge is a push to master). Plain pushes to other branches don't
# run, so a PR branch isn't tested twice. The README badge tracks master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch/PR supersedes an in-progress run.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
