name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security issues, please use
        [private reporting](https://github.com/akshay-kh/reload4u/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://example.com
        2. Click the Reload4U icon and choose "Select This Tab"
        3. Set the interval to 10 seconds
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Other Chromium-based (Edge, Brave, ...)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      description: Chrome → `chrome://version`, Firefox → `about:support`
      placeholder: e.g. Chrome 142.0.7444.60
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Reload4U version
      description: Shown at the bottom of the Reload4U settings page.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: interval
    attributes:
      label: Reload interval
      placeholder: e.g. 5 seconds, 2 minutes
  - type: dropdown
    id: stop-condition
    attributes:
      label: Stop condition
      options:
        - None
        - After N reloads
        - When the title changes
        - When the page content changes
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >-
        Screenshots, and errors from the extension's console (Chrome: `chrome://extensions` →
        Reload4U → "service worker"; Firefox: `about:debugging` → Reload4U → Inspect).
        Please remove any private URLs or page content first.
